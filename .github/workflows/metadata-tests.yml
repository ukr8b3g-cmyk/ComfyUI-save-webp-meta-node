name: Metadata adapter verification
on:
  push:
    branches: ['main', 'maintenance/metadata-v1.2.0']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: metadata-tests-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.10'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Set isolated test paths
        shell: python
        run: |
          import os
          from pathlib import Path
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for key, name in [('SAVE_META_PROVIDER_SOURCES', 'metadata-provider-sources'), ('METADATA_TEST_REPORT', 'metadata-test-result.json')]:
                  output.write(key + '=' + str(Path(os.environ['RUNNER_TEMP']) / name) + '\n')
      - name: Install existing image-test dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy piexif==1.1.3
      - name: Fetch pinned pure provider sources for parity tests
        run: python -B tools/fetch_test_sources.py
      - name: Validate syntax, original regressions, provider parity and five formats
        run: python -B tools/validate_metadata.py
      - name: Preserve validation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-result-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/metadata-test-result.json
          if-no-files-found: error
          retention-days: 14
  release-v1-2-0:
    needs: tests
    if: github.repository == 'ukr8b3g-cmyk/ComfyUI-save-webp-meta-node' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    concurrency:
      group: authorized-save-webp-release-v1.2.0
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Release only the authorized v1.2.0 source after both test gates
        run: python -B tools/release_v1_2_0.py

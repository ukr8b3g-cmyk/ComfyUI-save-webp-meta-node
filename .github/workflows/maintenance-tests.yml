name: Maintenance Tests

on:
  push:
    branches:
      - main
      - maintenance/qwen21-krea2-v1.1.0
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install Pillow piexif
      - name: Compile
        run: python -m py_compile webp_save.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v

name: Metadata offline test dependency
on:
  push:
    branches: ['maintenance/metadata-v1.2.0']
    paths: ['.github/workflows/metadata-test-deps.yml']
permissions:
  contents: read
jobs:
  dependency:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download existing runtime dependency without executing it
        run: |
          python -m pip download --no-deps --only-binary=:all: piexif==1.1.3 --dest wheels
      - uses: actions/upload-artifact@v4
        with:
          name: metadata-offline-dependency
          path: wheels/*.whl
          retention-days: 3
          if-no-files-found: error
